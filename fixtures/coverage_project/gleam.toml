name = "kangaroo_coverage_fixture"
version = "1.0.0"
target = "erlang"

[javascript.deno]
allow_env = true
allow_read = true
allow_run = true
allow_sys = true
allow_write = true

[dependencies]
kangaroo = { path = "../.." }

[tools.kangaroo.coverage]
include = ["src/**/*.gleam"]
exclude = []
minimum = 0
minimum_per_file = 0
reporters = ["terminal", "lcov", "cobertura"]
