name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: kangaroo (erlang)
            package: .
            target: erlang
          - name: kangaroo (javascript)
            package: .
            target: javascript
          - name: kangaroo_cli (erlang)
            package: ./cli
            target: erlang
          - name: kangaroo_cli (javascript)
            package: ./cli
            target: javascript
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - uses: oven-sh/setup-bun@v2
      - name: Download dependencies
        working-directory: ${{ matrix.package }}
        run: gleam deps download
      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          if [ "${{ matrix.target }}" = "javascript" ]; then
            gleam test -t javascript --runtime bun
          else
            gleam test -t erlang
          fi
      - name: Check formatting
        working-directory: ${{ matrix.package }}
        run: gleam format --check src test

  editors:
    runs-on: ubuntu-latest
    name: editors
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the VS Code extension syntax
        run: node --check editors/vscode/extension.js
      - name: Check the Neovim plugin manifests
        run: |
          test -f editors/neovim/lua/kangaroo/init.lua
          test -f editors/vscode/package.json
          node -e 'JSON.parse(require("fs").readFileSync("editors/vscode/package.json", "utf8"))'
