name: release-please

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      target:
        description: Artifact validation or registry to retry
        required: true
        default: all
        type: choice
        options: [all, build, github, hex, vscode, open-vsx]

permissions:
  actions: read
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wait for the bootstrapped manifest version tag
        id: release-bootstrap
        shell: bash
        run: |
          current_version="$(node -p 'require("./.release-please-manifest.json")["."]')"
          if git show-ref --verify --quiet "refs/tags/v${current_version}"; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Skipping release-please until bootstrap tag v${current_version} exists."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: googleapis/release-please-action@v4
        id: release
        if: steps.release-bootstrap.outputs.ready == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release-artifacts:
    needs: release-please
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      canonical_artifact_name: ${{ steps.version.outputs.canonical_artifact_name }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: erlef/setup-beam@v1
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - uses: actions/setup-node@v6
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify release version matches the tag
        id: version
        run: |
          release_version="${RELEASE_TAG#v}"
          test -n "${release_version}"
          test "${RELEASE_TAG}" = "v${release_version}"
          test "${release_version}" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' gleam.toml)"
          test "${release_version}" = "$(node -p 'require("./editors/vscode/package.json").version')"
          test "${release_version}" = "$(node -p 'require("./editors/vscode/package-lock.json").version')"
          test "${release_version}" = "$(node -p 'require("./editors/vscode/package-lock.json").packages[""]?.version')"
          canonical_artifact_name="kangaroo-release-${release_version}"
          if test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"; then
            artifact_name="${canonical_artifact_name}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            artifact_name="${canonical_artifact_name}"
          fi
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          {
            echo "tag_name=${RELEASE_TAG}"
            echo "version=${release_version}"
            echo "artifact_name=${artifact_name}"
            echo "canonical_artifact_name=${canonical_artifact_name}"
          } >> "${GITHUB_OUTPUT}"
      - name: Protect the canonical artifact from rebuilds
        if: github.event_name != 'workflow_dispatch'
        env:
          CANONICAL_ARTIFACT_NAME: ${{ steps.version.outputs.canonical_artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          artifact_count="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f "name=${CANONICAL_ARTIFACT_NAME}" \
            -f per_page=100 \
            --jq '[.artifacts[] | select(.expired == false)] | length')"
          if test "${artifact_count}" != 0; then
            echo "::error::Canonical artifact ${CANONICAL_ARTIFACT_NAME} already exists. Use workflow_dispatch to reuse its exact bytes."
            exit 1
          fi
      - name: Install locked editor release tools
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        working-directory: editors/vscode
        run: npm ci
      - name: Download dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        run: gleam deps download
      - name: Download daemon fixture dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        working-directory: fixtures/coverage_project
        run: gleam deps download
      - name: Build and test release source
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        run: |
          gleam build --target erlang --warnings-as-errors
          gleam build --target javascript --warnings-as-errors
          gleam test --target erlang
      - name: Build Hex and shared release artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        run: |
          mkdir -p dist
          gleam export hex-tarball
          cp "build/kangaroo-${RELEASE_VERSION}.tar" dist/
          cp docs/protocol-v1.schema.json dist/
          cp CHANGELOG.md dist/
      - name: Verify the exact Hex tarball lifecycle offline
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        run: python3 scripts/hex_clean_install_test.py "build/kangaroo-${RELEASE_VERSION}.tar"
      - name: Build the VS Code extension artifact
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        working-directory: editors/vscode
        run: npm run package -- --out "../../dist/kangaroo-${RELEASE_TAG}.vsix"
      - name: Generate and verify release checksums
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'build'
        working-directory: dist
        run: |
          sha256sum -- \
            "kangaroo-${RELEASE_VERSION}.tar" \
            "kangaroo-${RELEASE_TAG}.vsix" \
            protocol-v1.schema.json CHANGELOG.md > checksums.txt
          sha256sum --check checksums.txt
      - name: Restore the immutable release artifact for a retry
        if: github.event_name == 'workflow_dispatch' && inputs.target != 'build'
        env:
          CANONICAL_ARTIFACT_NAME: ${{ steps.version.outputs.canonical_artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist dist-from-release dist-from-actions

          verify_release_directory() {
            directory="$1"
            test -f "${directory}/kangaroo-${RELEASE_VERSION}.tar"
            test -f "${directory}/kangaroo-${RELEASE_TAG}.vsix"
            test -f "${directory}/protocol-v1.schema.json"
            test -f "${directory}/CHANGELOG.md"
            test -f "${directory}/checksums.txt"
            (cd "${directory}" && sha256sum --check checksums.txt)
          }

          copy_release_directory() {
            directory="$1"
            cp -- \
              "${directory}/kangaroo-${RELEASE_VERSION}.tar" \
              "${directory}/kangaroo-${RELEASE_TAG}.vsix" \
              "${directory}/protocol-v1.schema.json" \
              "${directory}/CHANGELOG.md" \
              "${directory}/checksums.txt" dist/
          }

          if gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist-from-release \
            --pattern "kangaroo-${RELEASE_VERSION}.tar" \
            --pattern "kangaroo-${RELEASE_TAG}.vsix" \
            --pattern protocol-v1.schema.json \
            --pattern CHANGELOG.md \
            --pattern checksums.txt \
            && verify_release_directory dist-from-release; then
            copy_release_directory dist-from-release
            echo "Restored exact artifacts from GitHub Release ${RELEASE_TAG}."
          else
            artifact_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              -f "name=${CANONICAL_ARTIFACT_NAME}" \
              -f per_page=100 \
              --jq '.artifacts | map(select(.expired == false)) | if length == 1 then .[0].id else empty end')"
            if test -z "${artifact_id}"; then
              echo "::error::No complete GitHub Release assets or unique unexpired canonical artifact exists for ${RELEASE_TAG}. Refusing to regenerate publication bytes."
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > artifact-download.zip
            unzip -q artifact-download.zip -d dist-from-actions
            verify_release_directory dist-from-actions
            copy_release_directory dist-from-actions
            echo "Restored exact artifacts from Actions artifact ${CANONICAL_ARTIFACT_NAME}."
          fi
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  publish-github-assets:
    needs: build-release-artifacts
    if: needs.build-release-artifacts.result == 'success' && (github.event_name == 'release' || github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'github')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build-release-artifacts.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release-artifacts.outputs.artifact_name }}
          path: dist
      - name: Verify downloaded artifacts
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Upload exact artifacts to the GitHub Release idempotently
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_state="${RUNNER_TEMP}/kangaroo-release-assets.json"
          existing_directory="${RUNNER_TEMP}/kangaroo-existing-release-assets"
          mkdir -p "${existing_directory}"
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets > "${release_state}"
          assets=(
            "kangaroo-${{ needs.build-release-artifacts.outputs.version }}.tar"
            "kangaroo-${RELEASE_TAG}.vsix"
            protocol-v1.schema.json
            CHANGELOG.md
            checksums.txt
          )
          for asset in "${assets[@]}"; do
            if jq --exit-status --arg name "${asset}" \
              '.assets | any(.name == $name)' "${release_state}" > /dev/null; then
              gh release download "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern "${asset}" \
                --output "${existing_directory}/${asset}"
              if ! cmp --silent -- "${asset}" "${existing_directory}/${asset}"; then
                echo "::error::GitHub Release asset ${asset} exists with different bytes. Refusing to overwrite it."
                exit 1
              fi
              echo "Verified existing GitHub Release asset ${asset}."
            else
              gh release upload "${RELEASE_TAG}" "${asset}" \
                --repo "${GITHUB_REPOSITORY}"
            fi
          done

  publish-hex:
    needs: build-release-artifacts
    if: needs.build-release-artifacts.result == 'success' && (github.event_name == 'release' || github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'hex')
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.build-release-artifacts.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-release-artifacts.outputs.tag_name }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release-artifacts.outputs.artifact_name }}
          path: dist
      - name: Verify downloaded artifacts
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Publish the exact Hex package artifact idempotently
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: python3 scripts/publish_hex_tarball.py "dist/kangaroo-${RELEASE_VERSION}.tar" kangaroo "${RELEASE_VERSION}"
      - name: Check whether Hex documentation is already published
        id: hex-docs
        shell: bash
        run: |
          docs_status="$(curl --location --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            "https://repo.hex.pm/docs/kangaroo-${RELEASE_VERSION}.tar.gz")"
          case "${docs_status}" in
            200) echo "publish=false" >> "${GITHUB_OUTPUT}" ;;
            404) echo "publish=true" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::Hex documentation lookup returned HTTP ${docs_status}."
              exit 1
              ;;
          esac
      - uses: erlef/setup-beam@v1
        if: steps.hex-docs.outputs.publish == 'true'
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - name: Publish Hex documentation from the tagged source
        if: steps.hex-docs.outputs.publish == 'true'
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: gleam docs publish

  publish-vscode-marketplace:
    needs: build-release-artifacts
    if: needs.build-release-artifacts.result == 'success' && (github.event_name == 'release' || github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'vscode')
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ needs.build-release-artifacts.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-release-artifacts.outputs.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release-artifacts.outputs.artifact_name }}
          path: dist
      - name: Verify downloaded artifacts
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Install locked editor release tools
        working-directory: editors/vscode
        run: npm ci
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: editors/vscode
        run: npm exec -- vsce publish --skip-duplicate --packagePath "../../dist/kangaroo-${RELEASE_TAG}.vsix"

  publish-open-vsx:
    needs: build-release-artifacts
    if: needs.build-release-artifacts.result == 'success' && (github.event_name == 'release' || github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'open-vsx')
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ needs.build-release-artifacts.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-release-artifacts.outputs.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release-artifacts.outputs.artifact_name }}
          path: dist
      - name: Verify downloaded artifacts
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Install locked editor release tools
        working-directory: editors/vscode
        run: npm ci
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        working-directory: editors/vscode
        run: npm exec -- ovsx publish --skip-duplicate "../../dist/kangaroo-${RELEASE_TAG}.vsix"
