name: release-please

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify release version matches the tag
        run: |
          test "${RELEASE_TAG#v}" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' gleam.toml)"
          test "${RELEASE_TAG#v}" = "$(node -p 'require("./editors/vscode/package.json").version')"
      - name: Install locked editor release tools
        working-directory: editors/vscode
        run: npm ci
      - run: gleam deps download
      - run: gleam build --target erlang --warnings-as-errors
      - run: gleam build --target javascript --warnings-as-errors
      - run: gleam test --target erlang
      - name: Build release artifacts
        run: |
          mkdir -p dist
          gleam export hex-tarball
          cp build/*.tar dist/
          cp docs/protocol-v1.schema.json dist/
          cp CHANGELOG.md dist/
      - name: Build the VS Code extension artifact
        working-directory: editors/vscode
        run: npm run package -- --out "../../dist/kangaroo-${RELEASE_TAG}.vsix"
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum -- ./* > checksums.txt
      - name: Upload artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Publish the Hex package
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: gleam publish --yes
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: editors/vscode
        run: npm exec -- vsce publish --packagePath "../../dist/kangaroo-${RELEASE_TAG}.vsix"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        working-directory: editors/vscode
        run: npm exec -- ovsx publish "../../dist/kangaroo-${RELEASE_TAG}.vsix" --pat "$OVSX_PAT"
